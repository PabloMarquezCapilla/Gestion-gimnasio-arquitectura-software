# Incluido en las rutas que solo aceptan la sesión JWT del portal.
# La validación ocurre en el gateway (auth.js); el servicio vuelve a validar sesión y rol.
default_type application/json;
if ($jwt_valido != "1") {
    add_header WWW-Authenticate 'Bearer' always;
    return 401 '{"codigo":"NO_AUTENTICADO","mensaje":"Se requiere una sesión válida y vigente."}';
}
