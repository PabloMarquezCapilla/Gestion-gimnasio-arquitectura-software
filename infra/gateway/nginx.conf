events {}

http {
    # No registrar rutas/query strings: no son necesarios para este mock inicial.
    access_log off;
    error_log /dev/stderr warn;

    # Docker puede cambiar las IP al recrear servicios. Resolver sus nombres
    # durante la ejecución evita conservar la IP de otro contenedor.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream socios_backend {
        zone socios_backend 64k;
        server socios-membresias:3000 resolve;
    }

    upstream clases_backend {
        zone clases_backend 64k;
        server clases-reservas:3000 resolve;
    }

    upstream accesos_backend {
        zone accesos_backend 64k;
        server accesos-ocupacion:3000 resolve;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;

        location = /api/v1/clases {
            proxy_pass http://clases_backend;
        }

        location /api/v1/clases/ {
            proxy_pass http://clases_backend;
        }

        location = /health/socios {
            proxy_pass http://socios_backend/health;
        }

        location = /health/clases {
            proxy_pass http://clases_backend/health;
        }

        location = /health/accesos {
            proxy_pass http://accesos_backend/health;
        }

        location = /health {
            default_type application/json;
            return 200 '{"servicio":"api-gateway","estado":"estructura-inicial"}';
        }

        location / {
            return 404;
        }
    }
}
