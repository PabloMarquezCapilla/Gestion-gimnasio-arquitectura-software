load_module modules/ngx_http_js_module.so;

# El gateway valida el JWT del portal con el mismo secreto que los servicios.
env AUTH_JWT_SECRET;
env AUTH_JWT_TTL_SECONDS;

# Hallazgo del test de carga (D13): con el valor por defecto (512) el gateway
# devolvía 500 al saturarse antes que los servicios.
events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
      '"uri":"$request_uri","status":$status,"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,"traceparent":"$http_traceparent",'
      '"x_correlation_id":"$http_x_correlation_id",'
      '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
      '"upstream_response_time":"$upstream_response_time"}';

    access_log /dev/stdout json_combined;

    js_path "/etc/nginx/njs/";
    js_import auth from auth.js;
    js_set $jwt_valido auth.jwtValido;

    # Detrás de Caddy (despliegue) o de la red de Docker se limita por IP real del cliente.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Control de tráfico: general por IP, login más estricto y consumidores externos por clave.
    limit_req_zone $binary_remote_addr zone=por_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $http_x_api_key zone=por_clave:10m rate=10r/s;
    limit_req_status 429;
    limit_req_log_level warn;
    error_log /dev/stderr warn;

    # Docker puede cambiar las IP al recrear servicios. Resolver sus nombres
    # durante la ejecución evita conservar la IP de otro contenedor.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream socios_backend {
        zone socios_backend 64k;
        least_conn;
        server socios-membresias:3000 max_fails=3 fail_timeout=10s resolve;
        keepalive 32;
    }

    upstream clases_backend {
        zone clases_backend 64k;
        least_conn;
        server clases-reservas:3000 max_fails=3 fail_timeout=10s resolve;
        keepalive 32;
    }

    upstream accesos_backend {
        zone accesos_backend 64k;
        least_conn;
        server accesos-ocupacion:3000 max_fails=3 fail_timeout=10s resolve;
        keepalive 32;
    }

    upstream tienda_backend {
        zone tienda_backend 64k;
        server tienda:3000 max_fails=3 fail_timeout=10s resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        # Reutiliza conexiones hacia los servicios (keepalive del upstream).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        # La credencial técnica es solo para llamadas dentro de la red de servicios.
        proxy_set_header X-Service-Key "";
        proxy_connect_timeout 3s;
        # Dejar responder al servicio dentro de su presupuesto HTTP de 3 s
        # de validación, más la operación local y el tránsito por la red.
        proxy_read_timeout 10s;
        proxy_intercept_errors off;

        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        limit_req zone=por_ip burst=60 nodelay;
        error_page 429 = @limitado;

        location @limitado {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"codigo":"LIMITE_EXCEDIDO","mensaje":"Demasiadas solicitudes. Reintentá en unos segundos."}';
        }

        location = /api/v1/clases {
            proxy_pass http://clases_backend;
        }

        location /api/v1/catalogo/ {
            include /etc/nginx/requiere-jwt.conf;
            proxy_pass http://clases_backend;
        }

        location /api/v1/admin/clases {
            include /etc/nginx/requiere-jwt.conf;
            proxy_next_upstream off;
            proxy_pass http://clases_backend;
        }

        location /api/v1/clases/ {
            proxy_pass http://clases_backend;
        }

        location = /api/v1/reservas {
            include /etc/nginx/requiere-jwt.conf;
            proxy_pass http://clases_backend;
        }

        location /api/v1/reservas/ {
            include /etc/nginx/requiere-jwt.conf;
            proxy_pass http://clases_backend;
        }

        location /api/v1/planes {
            include /etc/nginx/requiere-jwt.conf;
            proxy_next_upstream off;
            proxy_pass http://socios_backend;
        }
        location /api/v1/solicitudes {
            include /etc/nginx/requiere-jwt.conf;
            proxy_next_upstream off;
            proxy_pass http://socios_backend;
        }
        location /api/v1/pagos/ {
            include /etc/nginx/requiere-jwt.conf;
            proxy_next_upstream off;
            proxy_pass http://socios_backend;
        }

        location /api/v1/membresias/ {
            include /etc/nginx/requiere-jwt.conf;
            proxy_next_upstream off;
            proxy_pass http://socios_backend;
        }

        location = /api/v1/socios {
            include /etc/nginx/requiere-jwt.conf;
            proxy_pass http://socios_backend;
        }

        location /api/v1/accesos/ {
            include /etc/nginx/requiere-jwt.conf;
            # El cliente conserva Idempotency-Key ante resultado incierto.
            proxy_next_upstream off;
            proxy_read_timeout 20s;
            proxy_pass http://accesos_backend;
        }

        location = /api/v1/integraciones/empleados {
            limit_req zone=por_ip burst=60 nodelay;
            limit_req zone=por_clave burst=20 nodelay;
            proxy_pass http://socios_backend;
        }

        location /api/v1/integraciones/car-cruds/ {
            include /etc/nginx/requiere-jwt.conf;
            # Socios valida ADMIN; el cliente externo controla su propio presupuesto.
            proxy_next_upstream off;
            proxy_read_timeout 35s; # Mayor que el máximo configurable de 30 s del cliente.
            proxy_pass http://socios_backend;
        }

        location /api/v1/socios/ {
            include /etc/nginx/requiere-jwt.conf;
            proxy_pass http://socios_backend;
        }

        location = /api/v1/auth {
            proxy_pass http://socios_backend;
        }

        location = /api/v1/auth/login {
            # Frena fuerza bruta de contraseñas por IP.
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://socios_backend;
        }

        location /api/v1/auth/ {
            proxy_pass http://socios_backend;
        }

        location = /health/socios {
            proxy_pass http://socios_backend/health;
        }

        location = /api/v1/tienda/productos {
            include /etc/nginx/requiere-jwt.conf;
            # Tienda ya reintenta y degrada el catálogo de FAV; no repetir un 503 propio.
            proxy_next_upstream off;
            proxy_pass http://tienda_backend;
        }

        location /api/v1/tienda/ {
            include /etc/nginx/requiere-jwt.conf;
            # Incluye compras de socios: una compra incierta se recupera con la misma Idempotency-Key.
            proxy_next_upstream off;
            proxy_read_timeout 20s;
            proxy_pass http://tienda_backend;
        }

        # Rutas entre servicios (X-Service-Key): nunca se publican hacia afuera.
        location /internal/ {
            return 404;
        }

        location /api/v1/consignaciones/ {
            limit_req zone=por_ip burst=60 nodelay;
            limit_req zone=por_clave burst=20 nodelay;
            # El consumidor recupera una respuesta incierta con la misma entrega.
            proxy_next_upstream off;
            proxy_read_timeout 20s;
            proxy_pass http://tienda_backend;
        }

        location = /health/tienda {
            proxy_pass http://tienda_backend/health;
        }

        location = /health/clases {
            proxy_pass http://clases_backend/health;
        }

        location = /health/accesos {
            proxy_pass http://accesos_backend/health;
        }

        location = /metrics/clases {
            proxy_pass http://clases_backend/metrics;
        }

        location = /metrics/socios {
            proxy_pass http://socios_backend/metrics;
        }

        location = /metrics/accesos {
            proxy_pass http://accesos_backend/metrics;
        }

        location = /metrics/tienda {
            proxy_pass http://tienda_backend/metrics;
        }

        location = /health {
            default_type application/json;
            return 200 '{"servicio":"api-gateway","estado":"operativo"}';
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
