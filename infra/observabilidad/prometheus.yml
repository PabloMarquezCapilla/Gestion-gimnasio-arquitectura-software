# Prometheus descubre las instancias por DNS de Docker: las dos réplicas de
# clases-reservas aparecen como targets separados (evidencia del balanceo).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: socios-membresias
    dns_sd_configs:
      - names: [socios-membresias]
        type: A
        port: 3000
        refresh_interval: 10s

  - job_name: clases-reservas
    dns_sd_configs:
      - names: [clases-reservas]
        type: A
        port: 3000
        refresh_interval: 10s

  - job_name: accesos-ocupacion
    dns_sd_configs:
      - names: [accesos-ocupacion]
        type: A
        port: 3000
        refresh_interval: 10s

  - job_name: tienda
    dns_sd_configs:
      - names: [tienda]
        type: A
        port: 3000
        refresh_interval: 10s

  # Colas y DLQ de la mensajería de membresías.
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
