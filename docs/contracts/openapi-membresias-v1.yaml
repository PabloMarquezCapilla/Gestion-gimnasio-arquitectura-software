              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 50
                importeMinor:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                moneda:
                  type: string
                  pattern: ^[A-Z]{3}$
                  description: Código reconocido por Intl/ICU del runtime. Importe en unidad
                    mínima de esta moneda, sin conversión ni cálculo fiscal.
              required:
                - nombre
                - importeMinor
                - moneda
