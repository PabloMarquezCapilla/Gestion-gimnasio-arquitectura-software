components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Plan:
      type: object
      additionalProperties: false
      properties:
        planId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        nombre:
          type: string
          minLength: 1
          maxLength: 50
        importeMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código reconocido por Intl/ICU del runtime. Importe en unidad
            mínima de esta moneda, sin conversión ni cálculo fiscal.
        estado:
          enum:
            - ACTIVO
            - INACTIVO
      required:
        - planId
        - nombre
        - importeMinor
        - moneda
        - estado
    Pago:
      type: object
      additionalProperties: false
      properties:
        pagoId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        referencia:
          type: string
          minLength: 1
        estado:
          enum:
            - PENDIENTE
            - CONFIRMADO
            - RECHAZADO
      required:
        - pagoId
        - referencia
        - estado
    Comprobante:
      type: object
      additionalProperties: false
      properties:
        comprobanteId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        pagoId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        membresiaId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        confirmadoPor:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        confirmadoEn:
          type: string
          format: date-time
      required:
        - comprobanteId
        - pagoId
        - membresiaId
        - confirmadoPor
        - confirmadoEn
    Solicitud:
      type: object
      additionalProperties: false
      properties:
        solicitudId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        socioId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        planId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        nombrePlan:
          type: string
          minLength: 1
        importeMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código reconocido por Intl/ICU del runtime. Importe en unidad
            mínima de esta moneda, sin conversión ni cálculo fiscal.
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        estado:
          enum:
            - PENDIENTE
            - CONFIRMADA
            - RECHAZADA
        createdAt:
          type: string
          format: date-time
        pago:
          anyOf:
            - $ref: "#/components/schemas/Pago"
            - type: "null"
        comprobante:
          anyOf:
            - $ref: "#/components/schemas/Comprobante"
            - type: "null"
      required:
        - solicitudId
        - socioId
        - planId
        - nombrePlan
        - importeMinor
        - moneda
        - fechaInicio
        - fechaFin
        - estado
        - createdAt
        - pago
        - comprobante
    SocioAdministrativo:
      type: object
      additionalProperties: false
      properties:
        socioId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$
        dni:
          type: string
          minLength: 1
        nombre:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        estado:
          enum:
            - ACTIVO
            - INACTIVO
      required:
        - socioId
        - dni
        - nombre
        - email
        - estado
    Error:
      type: object
      additionalProperties: false
      properties:
        codigo:
          type: string
          minLength: 1
        mensaje:
          type: string
          minLength: 1
      required:
        - codigo
        - mensaje
