        "409":
          description: Validación, autorización, conflicto de estado/idempotencia o fallo
            de persistencia. No prueba cobro exitoso.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validación, autorización, conflicto de estado/idempotencia o fallo
