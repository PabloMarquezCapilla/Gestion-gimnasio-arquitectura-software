openapi: 3.1.1
info:
  title: Planes, pagos manuales y membresías — PULSE CLUB
  version: 1.0.0
  description: Contrato propio adicional de Socios. No altera los contratos
    externos. Comprobante interno no fiscal; no hay pasarela ni pagos
    automáticos.
servers:
  - url: http://localhost:8080
    description: Gateway local
security:
  - Bearer: []
paths:
  /api/v1/planes:
    get:
      summary: Consultar planes configurados
      description: ADMIN o SOCIO autenticado. Incluye activos/inactivos; sólo activos
        se seleccionan. Sin planes demo.
      parameters: []
      responses:
        "200":
          description: Resultado persistido o replay original
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
                required:
                  - items
        "400":
          description: Validación, autorización, conflicto de estado/idempotencia o fallo
            de persistencia. No prueba cobro exitoso.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Validación, autorización, conflicto de estado/idempotencia o fallo
            de persistencia. No prueba cobro exitoso.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Validación, autorización, conflicto de estado/idempotencia o fallo
            de persistencia. No prueba cobro exitoso.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Validación, autorización, conflicto de estado/idempotencia o fallo
            de persistencia. No prueba cobro exitoso.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Validación, autorización, conflicto de estado/idempotencia o fallo
            de persistencia. No prueba cobro exitoso.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
