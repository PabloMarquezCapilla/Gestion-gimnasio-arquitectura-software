            de persistencia. No prueba cobro exitoso.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Validación, autorización, conflicto de estado/idempotencia o fallo
            de persistencia. No prueba cobro exitoso.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Crear un plan con tarifa explícita
      description: Requiere ADMIN activo en backend.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,128}$
