# Override para el despliegue en una VM pública (ver docs/DEPLOY.md).
# Uso: COMPOSE_FILE=compose.yaml:compose.prod.yaml npm run iniciar
# Agrega Caddy con HTTPS en 80/443 y reinicio automático de todos los servicios.
# Bases, broker, Prometheus y el gateway siguen sin puertos públicos (solo 127.0.0.1).
x-reinicio: &reinicio
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.9.1-alpine
    <<: *reinicio
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env (ej. gimnasio.203-0-113-10.sslip.io)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy

  gateway: *reinicio
  socios-membresias: *reinicio
  clases-reservas: *reinicio
  accesos-ocupacion: *reinicio
  tienda: *reinicio
  postgres: *reinicio
  mongodb: *reinicio
  rabbitmq: *reinicio
  redis: *reinicio
  prometheus: *reinicio
  grafana:
    <<: *reinicio
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMINIO}

volumes:
  caddy-data:
  caddy-config:
